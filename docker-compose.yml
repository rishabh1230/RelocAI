services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: relocai_pgvector
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-relocai}
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - relocai_pgdata:/var/lib/postgresql/data

volumes:
  relocai_pgdata:
